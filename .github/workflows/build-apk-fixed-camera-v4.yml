name: Build Xiaomi Store Stock APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mtn2/stock
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XiaomiStoreStockMTN2"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mtn2.stock'
              compileSdk 35

              defaultConfig {
                  applicationId "com.mtn2.stock"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF6900</item>
                  <item name="android:statusBarColor">#FF6900</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Xiaomi Store Stock"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mtn2/stock/MainActivity.java <<'EOF'
          package com.mtn2.stock;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final int CAMERA_PERMISSION = 1001;
              private static final int FILE_CHOOSER_REQUEST = 1002;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private PermissionRequest pendingPermissionRequest;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {
                          return handleUrl(Uri.parse(url));
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              String[] types = params.getAcceptTypes();

                              if (types == null || types.length == 0 ||
                                      types[0] == null || types[0].trim().isEmpty()) {
                                  intent.setType("image/*");
                              }

                              intent.addCategory(Intent.CATEGORY_OPENABLE);

                              if (params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE) {
                                  intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                              }

                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;

                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {

                              pendingPermissionRequest = request;

                              if (android.os.Build.VERSION.SDK_INT >= 23 &&
                                      checkSelfPermission(Manifest.permission.CAMERA)
                                              != PackageManager.PERMISSION_GRANTED) {

                                  requestPermissions(
                                          new String[]{Manifest.permission.CAMERA},
                                          CAMERA_PERMISSION
                                  );

                              } else {
                                  request.grant(request.getResources());
                                  pendingPermissionRequest = null;
                              }
                          });
                      }
                  });

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                          checkSelfPermission(Manifest.permission.CAMERA)
                                  != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION
                      );
                  }

                  webView.loadUrl("https://xiaomistoreonlinev2.vercel.app/admin.html");
              }

              private boolean handleUrl(Uri uri) {

                  if (uri == null) return false;

                  String scheme = uri.getScheme();
                  if (scheme == null) return false;

                  scheme = scheme.toLowerCase();

                  // Website links stay inside the app.
                  if ("http".equals(scheme) || "https".equals(scheme)) {
                      return false;
                  }

                  // Phone.
                  if ("tel".equals(scheme)) {
                      try {
                          startActivity(new Intent(Intent.ACTION_DIAL, uri));
                      } catch (ActivityNotFoundException ignored) {
                      }
                      return true;
                  }

                  // LINE / Facebook / mailto / other app links.
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                  }

                  return true;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == CAMERA_PERMISSION &&
                          grantResults.length > 0 &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                      if (pendingPermissionRequest != null) {
                          pendingPermissionRequest.grant(
                                  pendingPermissionRequest.getResources()
                          );
                          pendingPermissionRequest = null;
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_CHOOSER_REQUEST ||
                          filePathCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {

                      if (data.getClipData() != null) {

                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];

                          for (int i = 0; i < count; i++) {
                              results[i] =
                                      data.getClipData()
                                              .getItemAt(i)
                                              .getUri();
                          }

                      } else if (data.getData() != null) {

                          results = new Uri[]{data.getData()};
                      }
                  }

                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(null);
                      filePathCallback = null;
                  }

                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }


          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF6900"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M31,31 L48,31 L48,77 L31,77 Z M48,45 L65,45 L65,77 L48,77 Z M65,31 L82,31 L82,77 L65,77 Z" />
          </vector>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaomiStoreStockMTN2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiStoreStockMTN2
          path: XiaomiStoreStockMTN2.apk
