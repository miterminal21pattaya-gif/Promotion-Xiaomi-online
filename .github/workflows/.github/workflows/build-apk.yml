name: Build Xiaomi Store Stock MTN2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p mtn2-app/app/src/main/java/com/mtn2/xiaomistorestock
          mkdir -p mtn2-app/app/src/main/res/drawable
          mkdir -p mtn2-app/app/src/main/res/values

          cat > mtn2-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XiaomiStoreStockMTN2"
          include(":app")
          EOF

          cat > mtn2-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > mtn2-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mtn2.xiaomistorestock'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mtn2.xiaomistorestock'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > mtn2-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Xiaomi Store Stock MTN2</string>
          </resources>
          EOF

          cat > mtn2-app/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="mi_orange">#FF6900</color>
          </resources>
          EOF

          cat > mtn2-app/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF6900</item>
                  <item name="android:statusBarColor">#FF6900</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > mtn2-app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#FF6900"
                  android:pathData="M18,0 L90,0 Q108,0 108,18 L108,90 Q108,108 90,108 L18,108 Q0,108 0,90 L0,18 Q0,0 18,0Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M16,45 L92,45 L92,63 L16,63Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M20,36 L36,36 L36,72 L20,72Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M40,36 L56,36 L56,72 L40,72Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M60,36 L88,36 L88,44 L60,44Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M60,50 L82,50 L82,58 L60,58Z" />

              <path
                  android:fillColor="#171717"
                  android:pathData="M60,64 L88,64 L88,72 L60,72Z" />
          </vector>
          EOF

          cat > mtn2-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > mtn2-app/app/src/main/java/com/mtn2/xiaomistorestock/MainActivity.java <<'EOF'
          package com.mtn2.xiaomistorestock;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private static final String PASSWORD = "mimtn2";

              private static final String ADMIN_URL =
                  "https://xiaomistoreonlinev2.vercel.app/index.html?admin=1";

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showLogin();
              }

              private void showLogin() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(35, 60, 35, 30);
                  root.setBackgroundColor(Color.rgb(245,245,245));

                  TextView icon = new TextView(this);
                  icon.setText("MTN2");
                  icon.setTextColor(Color.BLACK);
                  icon.setTextSize(38);
                  icon.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  icon.setGravity(Gravity.CENTER);
                  icon.setBackgroundColor(Color.rgb(255,105,0));

                  LinearLayout.LayoutParams iconParams =
                      new LinearLayout.LayoutParams(210,210);

                  iconParams.gravity = Gravity.CENTER;
                  root.addView(icon, iconParams);

                  TextView title = new TextView(this);
                  title.setText("Xiaomi Store Stock MTN2");
                  title.setTextSize(23);
                  title.setTextColor(Color.BLACK);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams titleParams =
                      new LinearLayout.LayoutParams(-1,-2);

                  titleParams.setMargins(0,28,0,8);
                  root.addView(title,titleParams);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("ระบบผู้ดูแลร้าน");
                  subtitle.setTextSize(16);
                  subtitle.setTextColor(Color.GRAY);
                  subtitle.setGravity(Gravity.CENTER);

                  root.addView(subtitle);

                  EditText password = new EditText(this);
                  password.setHint("รหัสผ่าน Admin");
                  password.setSingleLine(true);
                  password.setInputType(0x00000081);

                  LinearLayout.LayoutParams passParams =
                      new LinearLayout.LayoutParams(-1,-2);

                  passParams.setMargins(0,35,0,0);
                  root.addView(password,passParams);

                  Button login = new Button(this);
                  login.setText("เข้าสู่ระบบ Admin");
                  login.setTextSize(17);
                  login.setTextColor(Color.WHITE);
                  login.setBackgroundColor(Color.rgb(255,105,0));

                  LinearLayout.LayoutParams buttonParams =
                      new LinearLayout.LayoutParams(-1,-2);

                  buttonParams.setMargins(0,15,0,0);
                  root.addView(login,buttonParams);

                  login.setOnClickListener(v -> {

                      if (PASSWORD.equals(password.getText().toString())) {
                          openAdmin();
                      } else {
                          password.setError("รหัสผ่านไม่ถูกต้อง");
                      }

                  });

                  TextView footer = new TextView(this);
                  footer.setText(
                      "Xiaomi Store Terminal 21 Pattaya"
                  );
                  footer.setTextColor(Color.GRAY);
                  footer.setTextSize(13);
                  footer.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams footerParams =
                      new LinearLayout.LayoutParams(-1,-2);

                  footerParams.setMargins(0,25,0,0);
                  root.addView(footer,footerParams);

                  setContentView(root);
              }

              private void openAdmin() {

                  webView = new WebView(this);

                  webView.setWebViewClient(new WebViewClient());

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  webView.loadUrl(ADMIN_URL);

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }

              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: mtn2-app
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiStoreStockMTN2
          path: mtn2-app/app/build/outputs/apk/debug/app-debug.apk
