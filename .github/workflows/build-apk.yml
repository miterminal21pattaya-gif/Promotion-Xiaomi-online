name: Build Xiaomi Store Stock MTN2 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/mtn2/stock
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XiaomiStoreStockMTN2"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mtn2.stock'
              compileSdk 35

              defaultConfig {
                  applicationId "com.mtn2.stock"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF6900</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#FF6900</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Xiaomi Store Stock MTN2"
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # สร้างไอคอน MTN2 จริง
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          size = 512
          img = Image.new("RGB", (size, size), "#FF6900")
          draw = ImageDraw.Draw(img)

          # มุมโค้ง
          mask = Image.new("L", (size, size), 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle(
              (0, 0, size-1, size-1),
              radius=110,
              fill=255
          )
          img.putalpha(mask)

          # ตัวอักษร MTN2
          try:
              font = ImageFont.truetype(
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  150
              )
          except:
              font = ImageFont.load_default()

          text = "MTN2"
          bbox = draw.textbbox((0, 0), text, font=font)
          tw = bbox[2] - bbox[0]
          th = bbox[3] - bbox[1]

          x = (size - tw) / 2
          y = (size - th) / 2 - 10

          draw.text(
              (x, y),
              text,
              fill="#000000",
              font=font,
              stroke_width=2,
              stroke_fill="#000000"
          )

          img.save(
              "app/src/main/res/drawable/ic_launcher.png",
              "PNG"
          )
          PY

          cat > app/src/main/java/com/mtn2/stock/MainActivity.java <<'EOF'
          package com.mtn2.stock;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "https://xiaomistoreonlinev2.vercel.app/admin.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiStoreStockMTN2-v2
          path: app/build/outputs/apk/debug/app-debug.apk
