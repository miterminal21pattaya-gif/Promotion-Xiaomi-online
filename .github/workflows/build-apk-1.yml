name: Build Xiaomi Store Stock APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/mtn2/stock
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "XiaomiStoreStockMTN2"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mtn2.stock'
              compileSdk 35

              defaultConfig {
                  applicationId "com.mtn2.stock"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF6900</item>
                  <item name="android:statusBarColor">#FF6900</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Xiaomi Store Stock"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/mtn2/stock/MainActivity.java <<'EOF'
          package com.mtn2.stock;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setSupportZoom(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                      ) {
                          return openExternalLink(request.getUrl().toString());
                      }

                      @Override
                      @SuppressWarnings("deprecation")
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url
                      ) {
                          return openExternalLink(url);
                      }

                      private boolean openExternalLink(String url) {

                          if (url == null || url.trim().isEmpty()) {
                              return false;
                          }

                          Uri uri = Uri.parse(url);
                          String scheme = uri.getScheme();

                          if (scheme == null) {
                              return false;
                          }

                          /*
                           * เว็บไซต์ปกติ
                           * ให้ WebView เปิดภายในแอปตามเดิม
                           */
                          if (
                              scheme.equalsIgnoreCase("http") ||
                              scheme.equalsIgnoreCase("https")
                          ) {
                              return false;
                          }

                          /*
                           * เบอร์โทรศัพท์
                           *
                           * tel:0943338882
                           *
                           * เปิดหน้าจอโทรศัพท์
                           */
                          if (scheme.equalsIgnoreCase("tel")) {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_DIAL,
                                                  uri
                                          );

                                  startActivity(intent);

                              } catch (ActivityNotFoundException ignored) {
                              }

                              return true;
                          }

                          /*
                           * LINE
                           *
                           * line://
                           *
                           * เปิดแอป LINE
                           */
                          if (scheme.equalsIgnoreCase("line")) {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_VIEW,
                                                  uri
                                          );

                                  startActivity(intent);

                              } catch (ActivityNotFoundException e) {

                                  try {

                                      Intent fallback =
                                              new Intent(
                                                      Intent.ACTION_VIEW,
                                                      Uri.parse(
                                                              "https://line.me/"
                                                      )
                                              );

                                      startActivity(fallback);

                                  } catch (ActivityNotFoundException ignored) {
                                  }
                              }

                              return true;
                          }

                          /*
                           * Facebook
                           *
                           * fb://profile/...
                           *
                           * เปิด Facebook ถ้ามี
                           */
                          if (
                              scheme.equalsIgnoreCase("fb") ||
                              scheme.equalsIgnoreCase("facebook")
                          ) {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_VIEW,
                                                  uri
                                          );

                                  startActivity(intent);

                              } catch (ActivityNotFoundException e) {

                                  try {

                                      Intent fallback =
                                              new Intent(
                                                      Intent.ACTION_VIEW,
                                                      Uri.parse(
                                                              "https://www.facebook.com/"
                                                      )
                                              );

                                      startActivity(fallback);

                                  } catch (ActivityNotFoundException ignored) {
                                  }
                              }

                              return true;
                          }

                          /*
                           * Email
                           *
                           * mailto:
                           */
                          if (scheme.equalsIgnoreCase("mailto")) {

                              try {

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_SENDTO,
                                                  uri
                                          );

                                  startActivity(intent);

                              } catch (ActivityNotFoundException ignored) {
                              }

                              return true;
                          }

                          /*
                           * Scheme อื่น ๆ
                           *
                           * เช่น WhatsApp, Maps หรือแอปอื่น
                           * ให้ Android หาแอปที่รองรับเอง
                           */
                          try {

                              Intent intent =
                                      new Intent(
                                              Intent.ACTION_VIEW,
                                              uri
                                      );

                              startActivity(intent);

                              return true;

                          } catch (ActivityNotFoundException ignored) {

                              return true;
                          }
                      }
                  });

                  /*
                   * เว็บหลัก
                   */
                  webView.loadUrl(
                          "https://xiaomistoreonlinev2.vercel.app/admin.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }
          EOF

          cp icon.png app/src/main/res/drawable/app_icon.png

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XiaomiStoreStockMTN2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiStoreStockMTN2
          path: XiaomiStoreStockMTN2.apk
