<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xiaomi Store Admin</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#ff6900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app {
  width: min(430px, 94%);
  background: white;
  border-radius: 24px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.logo {
  width: 82px;
  height: 82px;
  border-radius: 20px;
  margin: 0 auto 18px;
  background: #ff6900;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  font-weight: bold;
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

p {
  color: #777;
  margin: 0 0 25px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 17px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.open {
  background: #ff6900;
  color: white;
}

.install {
  display: none;
  margin-top: 12px;
  background: #222;
  color: white;
}

.info {
  margin-top: 20px;
  font-size: 13px;
  color: #999;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">mi</div>

  <h1>ระบบผู้ดูแลร้าน</h1>

  <p>Xiaomi Store Terminal 21 Pattaya</p>

  <button class="open" onclick="openAdmin()">
    ⚙️ เปิดระบบ Admin
  </button>

  <button id="installApp" class="install" onclick="installApp()">
    📲 ติดตั้งแอป Admin
  </button>

  <div class="info">
    จัดการสินค้า โปรโมชั่น และข้อมูลร้าน
  </div>

</div>

<script>

function openAdmin() {
  window.location.href = "./admin.html";
}

/* Service Worker */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function() {
        console.log("Admin PWA Ready");
      })
      .catch(function(error) {
        console.error("Service Worker Error:", error);
      });
  });
}

/* Install PWA */
let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", function(event) {

  event.preventDefault();

  deferredPrompt = event;

  const installButton =
    document.getElementById("installApp");

  installButton.style.display = "block";
});

function installApp() {

  if (!deferredPrompt) {

    alert(
      "ยังไม่สามารถติดตั้งแอปได้ในขณะนี้ กรุณารีเฟรชหน้านี้แล้วลองอีกครั้ง"
    );

    return;
  }

  deferredPrompt.prompt();

  deferredPrompt.userChoice.then(function(choice) {

    console.log(
      "Install result:",
      choice.outcome
    );

    deferredPrompt = null;

    document.getElementById(
      "installApp"
    ).style.display = "none";

  });
}

window.addEventListener(
  "appinstalled",
  function() {

    document.getElementById(
      "installApp"
    ).style.display = "none";

    console.log("Admin App Installed");

  }
);

</script>

</body>
</html>
