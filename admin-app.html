<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Xiaomi Store Terminal 21 Pattaya</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.app {
  width: min(430px, 94%);
  background: white;
  border-radius: 24px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.logo {
  width: 76px;
  height: 76px;
  border-radius: 18px;
  margin: 0 auto 18px;
  background: #ff6900;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: bold;
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

p {
  color: #777;
  margin-bottom: 28px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 17px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.open {
  background: #ff6900;
  color: white;
}

.open:active {
  transform: scale(.98);
}

.info {
  margin-top: 20px;
  font-size: 13px;
  color: #999;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">mi</div>

  <h1>ระบบผู้ดูแลร้าน</h1>

  <p>
    Xiaomi Store Terminal 21 Pattaya
  </p>

  <button class="open" onclick="openAdmin()">
    ⚙️ เปิดระบบ Admin
  </button>

  <div class="info">
    จัดการสินค้า โปรโมชั่น และข้อมูลร้าน
  </div>

</div>

<script>
function openAdmin() {
  window.location.href = "admin.html";
}
</script>

</body>
</html>
