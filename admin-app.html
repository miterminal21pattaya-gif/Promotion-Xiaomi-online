<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ff6900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xiaomi Admin">

<link rel="manifest" href="manifest.json">

<title>Xiaomi Store Terminal 21 Pattaya - Admin</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.app {
  width: min(430px, 94%);
  background: white;
  border-radius: 24px;
  padding: 28px 22px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,.12);
}

.logo {
  width: 76px;
  height: 76px;
  border-radius: 18px;
  margin: 0 auto 18px;
  background: #ff6900;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  font-weight: bold;
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
}

p {
  color: #777;
  margin-bottom: 28px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 17px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.open {
  background: #ff6900;
  color: white;
}

.install {
  margin-top: 12px;
  background: #222;
  color: white;
  display: none;
}

.open:active,
.install:active {
  transform: scale(.98);
}

.info {
  margin-top: 20px;
  font-size: 13px;
  color: #999;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">mi</div>

  <h1>ระบบผู้ดูแลร้าน</h1>

  <p>
    Xiaomi Store Terminal 21 Pattaya
  </p>

  <button class="open" onclick="openAdmin()">
    ⚙️ เปิดระบบ Admin
  </button>

  <button class="install" id="installBtn">
    📱 ติดตั้งแอป Admin
  </button>

  <div class="info">
    จัดการสินค้า โปรโมชั่น และข้อมูลร้าน
  </div>

</div>

<script>

function openAdmin() {
  window.location.href = "admin.html";
}


/* =========================
   PWA INSTALL
========================= */

let deferredPrompt = null;

const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", function(e) {

  e.preventDefault();

  deferredPrompt = e;

  installBtn.style.display = "block";

});


installBtn.addEventListener("click", async function() {

  if (!deferredPrompt) {

    alert(
      "ถ้าไม่เห็นหน้าติดตั้ง ให้กดเมนู ⋮ ของ Chrome แล้วเลือก \"ติดตั้งแอป\" หรือ \"เพิ่มไปยังหน้าจอหลัก\""
    );

    return;
  }

  deferredPrompt.prompt();

  const result = await deferredPrompt.userChoice;

  if (result.outcome === "accepted") {
    console.log("ติดตั้งแอปแล้ว");
  }

  deferredPrompt = null;

  installBtn.style.display = "none";

});


window.addEventListener("appinstalled", function() {

  installBtn.style.display = "none";

});


/* =========================
   SERVICE WORKER
========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function() {

    navigator.serviceWorker
      .register("service-worker.js")
      .then(function() {

        console.log("PWA พร้อมใช้งาน");

      })
      .catch(function(error) {

        console.log("PWA Error:", error);

      });

  });

}

</script>

</body>
</html>
