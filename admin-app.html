<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Xiaomi Store Admin</title>

<link rel="manifest" href="admin-manifest.json">

<meta name="theme-color" content="#ff6900">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xiaomi Admin">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}

.app{
  width:min(430px,94%);
  background:white;
  border-radius:24px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 18px;
  border-radius:20px;
  background:#ff6900;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:bold;
}

h1{
  margin:0 0 8px;
  font-size:25px;
}

p{
  color:#777;
  margin:0 0 25px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.open{
  background:#ff6900;
  color:white;
}

.install{
  margin-top:12px;
  background:#222;
  color:white;
  display:none;
}

.info{
  margin-top:20px;
  color:#999;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

  <div class="logo">mi</div>

  <h1>ระบบผู้ดูแลร้าน</h1>

  <p>Xiaomi Store Terminal 21 Pattaya</p>

  <button class="open" onclick="openAdmin()">
    ⚙️ เปิดระบบ Admin
  </button>

  <button id="installBtn" class="install">
    📲 ติดตั้งแอป Admin
  </button>

  <div class="info">
    จัดการสินค้า โปรโมชั่น ราคา และข้อมูลร้าน
  </div>

</div>

<script>

let deferredPrompt = null;

function openAdmin(){
  window.location.href = "admin.html";
}

/* ติดตั้ง PWA */
window.addEventListener("beforeinstallprompt", function(e){

  e.preventDefault();

  deferredPrompt = e;

  document.getElementById("installBtn").style.display = "block";

});

document.getElementById("installBtn").addEventListener("click", async function(){

  if(!deferredPrompt){
    alert(
      "ถ้ายังไม่พบการติดตั้ง ให้กดเมนู ⋮ ของ Chrome แล้วเลือก \"ติดตั้งแอป\" หรือ \"เพิ่มไปยังหน้าจอหลัก\""
    );
    return;
  }

  deferredPrompt.prompt();

  const result = await deferredPrompt.userChoice;

  deferredPrompt = null;

  document.getElementById("installBtn").style.display = "none";

});

/* Service Worker */
if("serviceWorker" in navigator){

  window.addEventListener("load", function(){

    navigator.serviceWorker.register("admin-sw.js")
      .then(function(){
        console.log("Admin Service Worker Ready");
      })
      .catch(function(error){
        console.error("Admin Service Worker Error:",error);
      });

  });

}

</script>

</body>
</html>
