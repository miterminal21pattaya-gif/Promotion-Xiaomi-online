<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Xiaomi Store</title>
<style>body{font-family:Arial,"Noto Sans Thai",sans-serif;margin:0;background:#f5f5f5;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 32px));background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002}.logo{font-size:24px;font-weight:900;margin-bottom:8px}.mi{display:inline-block;background:#ff6900;color:#fff;padding:6px 8px;border-radius:7px;margin-right:7px}.sub{color:#777;margin-bottom:22px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:18px}button{width:100%;margin-top:14px;background:#ff6900;color:#fff;border:0;padding:14px;border-radius:10px;font-size:17px;font-weight:800}.err{color:#d71920;margin-top:12px;display:none}.hint{font-size:13px;color:#999;margin-top:16px;text-align:center}</style></head>
<body><div class="box"><div class="logo"><span class="mi">mi</span> Xiaomi Store</div><h2>🔐 Admin</h2><p class="sub">หน้านี้สำหรับผู้ดูแลร้านเท่านั้น</p><label for="pw">รหัสผ่าน Admin</label><input id="pw" type="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password"><button onclick="login()">เข้าสู่ระบบ Admin</button><div id="err" class="err">รหัสผ่านไม่ถูกต้อง</div><div class="hint">ลูกค้าควรใช้หน้าโปรโมชั่นหลักเท่านั้น</div></div>
<script>function login(){const p=document.getElementById('pw').value;if(p==='mimtn2'){sessionStorage.setItem('xiaomi_admin_auth','mimtn2');location.href='index.html?admin=1'}else{document.getElementById('err').style.display='block'}}document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
