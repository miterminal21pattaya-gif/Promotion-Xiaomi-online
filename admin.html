<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Xiaomi Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,'Noto Sans Thai',sans-serif;margin:0;background:#f5f5f5;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(420px,100%);background:#fff;padding:30px 24px;border-radius:20px;box-shadow:0 8px 35px #0002;text-align:center}
.logo{width:64px;height:64px;border-radius:16px;background:#ff6900;color:#fff;display:grid;place-items:center;font-weight:900;font-size:28px;margin:0 auto 18px}
h1{margin:0 0 8px;font-size:25px}
p{color:#777;margin:0 0 24px}
label{display:block;text-align:left;font-weight:700;margin:0 0 8px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:17px;margin-bottom:14px}
button{width:100%;border:0;background:#ff6900;color:#fff;padding:14px;border-radius:12px;font-size:17px;font-weight:700}
button:disabled{opacity:.6}
.msg{min-height:24px;margin-top:14px;color:#d33;font-size:14px}
.small{font-size:12px;color:#999;margin-top:18px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">mi</div>
  <h1>Admin Xiaomi Store</h1>
  <p>สำหรับผู้ดูแลร้านเท่านั้น</p>
  <form id="loginForm">
    <label for="password">รหัสผ่าน Admin</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="ใส่รหัสผ่าน" required>
    <button id="loginBtn" type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="small">ลูกค้าทั่วไปไม่สามารถแก้ไขโปรโมชั่นได้</div>
</div>
<script>
const supabase = window.supabase.createClient('https://hjhfemdpijjilbeigard.supabase.co', 'sb_publishable_lFwXizCRpSHCcIKzfLHppw_ZUEFDC6C');
const ADMIN_EMAIL = 'admin@xiaomistore.local';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = 'กำลังตรวจสอบ...';

  const password = document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({ email: ADMIN_EMAIL, password });

  if (error) {
    msg.textContent = 'รหัสผ่านไม่ถูกต้อง';
    btn.disabled = false;
    return;
  }

  location.href = 'index.html?admin=1';
});
</script>
</body>
</html>
